name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: full package gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Cache the downloaded real-media corpus keyed by the manifest (sha256-pinned).
      - name: Cache fixtures
        uses: actions/cache@v4
        with:
          path: fixtures/media
          key: fixtures-${{ hashFiles('fixtures/manifest.json') }}

      - name: Fetch + verify corpus
        run: bun run fetch-fixtures

      - name: Typecheck
        run: bun run typecheck

      - name: Documentation checks
        run: bun run docs:check

      - name: Lint + format
        run: bunx biome ci .

      - name: Test + coverage (≥90%)
        run: bun run test:cov

      - name: Build (ESM + .d.ts)
        run: bun run build

      - name: Vendor WASM artifacts
        run: bun run vendor-wasm

      - name: Test published artifacts
        run: bun run test:dist

      - name: Bundle budgets
        run: bun run check-budgets

      - name: Verify clean package consumer
        run: bun run verify:package

      - name: Verify integrity
        run: bun run verify:integrity

  # Cross-browser/device, performance, memory, and soak evidence lives in the media-test matrix; this
  # package-quality job does not by itself certify the repository's full SOTA release claims.
